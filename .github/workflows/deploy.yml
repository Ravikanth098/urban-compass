name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      # ✅ 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # ✅ 2. Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # ✅ 3. Install backend (FIXED)
      - name: Install backend
        run: |
          cd backend
          npm install --legacy-peer-deps

      # ✅ 4. Install frontend (FIXED)
      - name: Install frontend
        run: |
          cd frontend
          npm install --legacy-peer-deps

      # ✅ 5. Build frontend
      - name: Build frontend
        run: |
          cd frontend
          npm run build

      # ✅ 6. Copy build to backend
      - name: Copy build
        run: |
          rm -rf backend/frontend
          mkdir backend/frontend
          cp -r frontend/build/* backend/frontend/

      # ✅ 7. Zip application
      - name: Zip app
        run: zip -r app.zip backend

      # ✅ 8. Deploy to AWS Elastic Beanstalk
      - name: Deploy to AWS
        uses: einaregilsson/beanstalk-deploy@v21
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY }}
          aws_secret_key: ${{ secrets.AWS_SECRET_KEY }}
          application_name: myapp
          environment_name: Myapp-env
          region: ap-south-1
          version_label: v-${{ github.run_number }}
          deployment_package: app.zip