name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install backend
        run: |
          cd backend
          npm install

      - name: Build frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Copy build to backend
        run: |
          rm -rf backend/frontend
          mkdir backend/frontend
          cp -r frontend/build/* backend/frontend/